[project]
name = "wetlab-api"
version = "0.1.0"
description = "Wet Lab data API"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2",
    "scipy>=1.18.1",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "sqlacodegen>=4.0.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
